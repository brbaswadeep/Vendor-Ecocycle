  <!--AudioContext guard to prevent browser extension PatchedAC errors from failing on clicks-->
  <script type="text/javascript">
    (function () {
      try {
        var createMockAC = function () {
          return {
            createGain: function () { return { gain: { value: 1 }, connect: function () { } }; },
            createOscillator: function () { return { connect: function () { }, start: function () { }, stop: function () { } }; },
            createBufferSource: function () { return { connect: function () { }, start: function () { }, stop: function () { } }; },
            destination: {},
            currentTime: 0,
            state: 'running',
            close: function () { return Promise.resolve(); },
            resume: function () { return Promise.resolve(); },
            suspend: function () { return Promise.resolve(); }
          };
        };
        var OrigAC = window.AudioContext || window.webkitAudioContext;
        if (OrigAC) {
          var SafeAC = function () {
            try {
              return new OrigAC();
            } catch (e) {
              return createMockAC();
            }
          };
          SafeAC.prototype = OrigAC.prototype;
          window.AudioContext = SafeAC;
          window.webkitAudioContext = SafeAC;
        }
      } catch (_) {}
    })();
  </script>
